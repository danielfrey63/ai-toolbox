# cpu-watchdog Stop-Liste — oberste Zeile wird zuerst gestoppt, ein Eintrag
# pro Eskalations-Tick (1 min Abstand). Reihenfolge = Priorität; frei
# umsortieren und ergänzen, der Watchdog liest die Datei bei jedem Lauf neu.
#
# Formate:
#   user-unit <name>    systemd-User-Unit stoppen (falls aktiv)
#   pkill <pattern>     Prozesse per pkill -f <pattern> beenden (falls vorhanden)
#
# Default-Priorisierung: zuerst jederzeit wiederholbare Batch-Jobs, dann
# Inferenz-Server, zuletzt nichts Interaktives — Claude-Code-Sessions und
# Desktop-Programme stoppt der Watchdog bewusst NIE.

# 1. Nächtlicher Session-Export/-Index — idempotent, holt der nächste Lauf nach
user-unit claude-dream.service

# 2. Manuell gestartete full-rag Index-/Reindex-Läufe — inkrementell, Neustart ist billig
pkill full-rag.js index

# 3. Lokale LLM-/Embedding-Server (falls je wieder installiert)
user-unit ollama.service
pkill ollama serve
